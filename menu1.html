<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu Frei</title>

    <link rel="stylesheet" href="menu1.css">
</head>

<body>

    <div class="pai">

        <img
            src="./pictures/Logo_Feira_das_Profissoes_2026_-_PNG_Vetor_-_FINAL.webp"
            alt="Logo Feira das Profissões"
        >

        <h1>E-mail de acesso</h1>

        <div class="campo">
            <input
                type="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
            >
        </div>

        <h1>Senha</h1>

        <div class="campo">
            <input
                type="password"
                placeholder="Digite sua senha"
                autocomplete="current-password"
            >
        </div>

        <div class="Sistema">
            <a href="painel.html">
                <h1>Acessar Sistema</h1>
            </a>
        </div>

        <div class="voltar">
            <h1>Voltar</h1>
        </div>

    </div>

</body>

</html>
